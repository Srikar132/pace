name: pace
description: "PACE is a smart focus and study companion designed to help users enter a distraction-free study mode."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  cloud_firestore: ^6.1.1
  firebase_analytics: ^12.1.0
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_svg: ^2.2.3
  google_sign_in: ^6.2.1
  permission_handler: ^12.0.1
  riverpod: ^3.0.3
  shimmer: ^3.0.0
  smooth_page_indicator: ^2.0.1
  audioplayers: ^6.0.0
  go_router: ^17.0.1
  lottie: ^3.3.2
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  crypto: ^3.0.3
  installed_apps: ^1.4.0
  
  # Voice Assistant Dependencies
  record: ^5.2.1
  web_socket_channel: ^2.4.0
  http: ^1.2.0
  path_provider: ^2.1.2
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.3

dependency_overrides:
  record_linux: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/splash/
    - assets/sounds/

flutter_launcher_icons:
  image_path: "assets/icons/icon.png"
  android: "launcher_icon"
  ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#0B0B0C"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icons/icon_monochrome.png"

flutter_native_splash:
  color: "#0B0B0C"
  image: assets/splash/splash_logo.png
  android_12:
    image: assets/splash/splash_logo.png
    color: "#0B0B0C"
    icon_background_color: "#0B0B0C"

